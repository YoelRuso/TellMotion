name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    name: Tests and theme validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate
      - run: npm run doctor
      - run: npm test
  site:
    name: Website builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - working-directory: site
        run: |
          npm ci
          npm run build
  smoke:
    name: Scaffold and type-check (all packs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run test:smoke
